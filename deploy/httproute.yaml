# deploy/httproute.yaml — template HTTPRoute PEMBAGIAN TRAFFIC (envsubst).
# Dipakai strategi blue-green dan canary. Contoh weight canary dari spec §5:
#   app-stable  port 80 weight 90
#   app-canary  port 80 weight 10
#
# Substitusi (lihat scripts/lib.sh: set_weights):
#   ${BACKEND_1} ${WEIGHT_1} ${BACKEND_2} ${WEIGHT_2}
#
# Port 80 = port Service aplikasi (deploy/base/service.yaml), yang
# meneruskan ke containerPort 8080 milik aplikasi Go.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  labels:
    app.kubernetes.io/part-of: deploy-strategies-demo
spec:
  parentRefs:
    - name: demo
  rules:
    - backendRefs:
        - name: ${BACKEND_1}
          port: 80
          weight: ${WEIGHT_1}
        - name: ${BACKEND_2}
          port: 80
          weight: ${WEIGHT_2}
